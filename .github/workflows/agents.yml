# The agents review every pull request into main: the reviewer, tester, critic and business
# analyst, as one comment on the PR that later pushes update. The workflow lives in the public
# germanndarian/agents-ci; this repo only needs the CLAUDE_CODE_OAUTH_TOKEN secret.
name: Agents
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  agents:
    uses: germanndarian/agents-ci/.github/workflows/agents.yml@main
    permissions:
      contents: read
      pull-requests: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
